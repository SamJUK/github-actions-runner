name: Build and Release Runner
run-name: Release Github Actions Runner version ${{ inputs.version }}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      version:
        description: 'Runner Version to release'
        required: true
        type: string
      ubuntu_version:
        description: 'Ubuntu Version to use for the runner'
        required: false
        type: string
        default: '22.04'
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Runner Version to release'
        required: true
        type: string
        default: 'latest'
      ubuntu_version:
        description: 'Ubuntu Version to use for the runner'
        required: false
        type: string
        default: '22.04'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - run: make test
        env:
          RUNNER_VERSION: ${{ inputs.version }}
          UBUNTU_VERSION: ${{ inputs.ubuntu_version }}

  build-docker-image:
    needs: test
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      IMAGE_NAME: samjuk/github-actions-runner

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RUNNER_VERSION=${{ inputs.version }}
            UBUNTU_VERSION=${{ inputs.ubuntu_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.version }}

  create-release:
    needs: build-docker-image
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      IMAGE_NAME: samjuk/github-actions-runner
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release v${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          generate_release_notes: false
          append_body: false
          body: |
            Release of GitHub Actions Runner version `${{ inputs.version }}`.

            ## New Docker Images
            - `${{ env.IMAGE_NAME }}:latest`
            - `${{ env.IMAGE_NAME }}:${{ inputs.version }}`
            - `ghcr.io/${{ env.IMAGE_NAME }}:latest`
            - `ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
